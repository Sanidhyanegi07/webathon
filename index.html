<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NIRVAN '26 — Annual Technical Festival at Graphic Era Hill University. Register for Hackathon, CTF, E-Sports, Treasure Hunt & Workshop." />
    <title>NIRVAN '26 — Technical Fest | Graphic Era Hill University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  </head>
  <body class="bg-n-bg text-n-white antialiased">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="color:red; padding: 20px; font-family: monospace;"><h2>React Error:</h2><p>' + msg + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red; padding: 20px; font-family: monospace;"><h2>Unhandled Promise Rejection:</h2><p>' + event.reason + '</p><pre>' + (event.reason ? event.reason.stack : '') + '</pre></div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
