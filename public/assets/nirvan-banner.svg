<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NIRVAN '26 Annual Technical Festival</title>
  <desc id="desc">A bold neo-brutalist festival banner for coding, cybersecurity, design and gaming.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D6"/>
      <stop offset="1" stop-color="#F5F0E8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#1A1A1A" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#1A1A1A"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="url(#paper)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <circle cx="1390" cy="80" r="220" fill="#0055FF"/>
  <circle cx="1390" cy="80" r="150" fill="#FFCC00" stroke="#1A1A1A" stroke-width="12"/>
  <path d="M1275 210L1510 445" stroke="#E63B2E" stroke-width="38"/>
  <path d="M1450 210L1215 445" stroke="#10B981" stroke-width="38"/>
  <rect x="70" y="64" width="570" height="56" fill="#1A1A1A"/>
  <text x="92" y="102" fill="#FFCC00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="5">GRAPHIC ERA HILL UNIVERSITY</text>
  <text x="72" y="305" fill="#1A1A1A" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="170" font-weight="900" letter-spacing="-8">NIRVAN</text>
  <text x="84" y="382" fill="#E63B2E" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="8">'26</text>
  <rect x="270" y="330" width="535" height="66" fill="#FFCC00" stroke="#1A1A1A" stroke-width="10" filter="url(#shadow)"/>
  <text x="300" y="375" fill="#1A1A1A" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" letter-spacing="3">BUILD • BREAK • BECOME</text>
  <text x="78" y="478" fill="#1A1A1A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">ANNUAL TECHNICAL FESTIVAL</text>
  <text x="80" y="530" fill="#1A1A1A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">CODING  /  CYBERSECURITY  /  DESIGN  /  E-SPORTS</text>
  <rect x="1190" y="500" width="330" height="62" fill="#1A1A1A" transform="rotate(-7 1190 500)"/>
  <text x="1218" y="540" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900" letter-spacing="2" transform="rotate(-7 1218 540)">HALDWANI • INDIA</text>
  <path d="M1040 470L1120 390L1200 470L1120 550L1040 470Z" fill="#FFCC00" stroke="#1A1A1A" stroke-width="12"/>
  <path d="M1080 470H1160M1120 430V510" stroke="#1A1A1A" stroke-width="10"/>
